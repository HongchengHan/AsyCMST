---
task: 'BUS-CEUS-Cls'
params:
    batch_size: 8
    epoch: 200
    optimizer: adamw
    lr: 0.0001
    factor: 0.5
    patience: 5
    w_decay: 0.0001
    momentum: 0.9
    ECLossWeight: auto
model:
    name: tsnet_rx50
    pretrain: False
    load_path: None
    freeze: False
save:
    path: null
    exp: null
    num_ckpt: null

data:
    root_dir: './datasets/CEUS_splitted_frames'
    train_label: 'train_1.csv'
    valid_label: 'valid_1.csv'
    test_label: 'test_1.csv'
    num_class: 2
    size: 224
    num_frm: 16
    num_workers: 8
    normalize: true
    header: True
    name: 'XJTU-MMUS'
    augment: True
    aug:
        resize_crop: True
        color_jitter: False
        rotation: True
        h_flip: True
        v_flip: True

device:
    single: 'cuda:0'
    dp:
        output_device: 'cuda:0'
        device_ids: [0, 1]
    ddp:
        local_rank: 0
