---
task: 'BUS-CEUS-Transformer-Baseline'
params:
    batch_size: 8
    epoch: 100
    optimizer: adamw
    lr: 0.0001
    factor: 0.5
    patience: 5
    w_decay: 0.0001
    momentum: 0.9
    ECLossWeight: auto
model:
    name: dual_transformer_baseline
    pretrain: True
    embed_dim: 256
    num_layers: 2
    num_heads: 8
    dropout: 0.1
    load_path: null
save:
    path: null
data:
    root_dir: './datasets/CEUS_splitted_frames'
    train_label: 'train_1.csv'
    valid_label: 'valid_1.csv'
    test_label: 'test_1.csv'
    num_class: 2
    size: 224
    num_frm: 16
    num_workers: 8
    normalize: true
    use_mask: false
    augment: true
    aug:
        resize_crop: True
        color_jitter: False
        rotation: True
        h_flip: True
        v_flip: True
device:
    single: 'cuda:0'
