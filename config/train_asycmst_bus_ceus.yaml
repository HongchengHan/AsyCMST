---
task: 'BUS-CEUS-Cls'
params:
    batch_size: 8
    epoch: 200
    optimizer: adamw
    lr: 0.0001
    factor: 0.5
    patience: 5
    w_decay: 0.0001
    momentum: 0.9
    ECLossWeight: auto
    fss_weight: 0.1
    seg_weight: 0.4
model:
    name: asycmst_r18_384_6_6
    pretrain: True
    cross_gate_init: 0.1
    # Zero-based: 3 means cross attention is used only in layers 4-6.
    cross_attention_start_layer: 3
    load_path: None
    freeze: False
save:
    path: null
    exp: null
    num_ckpt: null

data:
    root_dir: './datasets/CEUS_splitted_frames'
    train_label: 'train_1.csv'
    valid_label: 'valid_1.csv'
    test_label: 'test_1.csv'
    num_class: 2
    size: 224
    num_frm: 16
    num_workers: 8
    normalize: true
    # Optional BUS segmentation supervision. No masks are read by default.
    use_mask: false
    mask_column: mask_dir
    mask_root: masks
    header: True
    name: 'XJTU-MMUS'
    augment: True
    aug:
        resize_crop: True
        color_jitter: False
        rotation: True
        h_flip: True
        v_flip: True

device:
    single: 'cuda:0'
    dp:
        output_device: 'cuda:0'
        device_ids: [0, 1]
    ddp:
        local_rank: 0
