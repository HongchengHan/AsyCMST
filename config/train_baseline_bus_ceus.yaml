---
task: 'BUS-CEUS-Baseline'
params:
    batch_size: 8
    epoch: 100
    optimizer: adamw
    lr: 0.0001
    factor: 0.5
    patience: 5
    w_decay: 0.0001
    momentum: 0.9
    ECLossWeight: auto
model:
    name: dual_resnet18_baseline
    pretrain: True
    dropout: 0.3
    load_path: null
    freeze: False
save:
    path: null
    exp: null
    num_ckpt: null
data:
    root_dir: './datasets/CEUS_splitted_frames'
    train_label: 'train_1.csv'
    valid_label: 'valid_1.csv'
    test_label: 'test_1.csv'
    num_class: 2
    size: 224
    num_frm: 16
    num_workers: 8
    normalize: true
    use_mask: false
    header: True
    name: 'XJTU-MMUS'
    augment: True
    aug:
        resize_crop: True
        color_jitter: False
        rotation: True
        h_flip: True
        v_flip: True
device:
    single: 'cuda:0'
